[workspace]
members = ["crates/libibt", "crates/libibt-python", "crates/libibt-ffi"]
resolver = "2"

[workspace.package]
# The one version of the project. The three crates inherit it, and the Python
# package takes it from crates/libibt-python (pyproject.toml declares its
# version dynamic), so a release bumps this line and nothing else.
version = "0.2.0"

[workspace.dependencies]
arrow = { version = "57", default-features = false }
memmap2 = "0.9"
thiserror = "2"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

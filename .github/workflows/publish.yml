name: Build and Publish

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: 'Publish to PyPI'
        required: true
        default: 'false'
        type: boolean

jobs:
  # One runner per OS/arch does everything that used to be spread over
  # 25 "Build wheel" + 25 "Test wheel" runners:
  #   1. build the wheels for every supported Python with cibuildwheel
  #   2. test each wheel from a fresh venv outside the checkout, so the
  #      tests only see what the wheel installed
  # Lint, clippy, the Rust tests and the from-source pytest run live in the
  # Check workflow (check.yml).
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Note: windows-11-arm excluded until pyarrow publishes Windows ARM64 wheels
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-latest, windows-latest]
    env:
      # Keep in sync with `build` in [tool.cibuildwheel] in pyproject.toml.
      PYTHON_VERSIONS: "3.10 3.11 3.12 3.13 3.14"

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    # The Python versions to build come from [tool.cibuildwheel] in pyproject.toml.
    - name: Build wheels (all Python versions)
      run: uvx cibuildwheel==3.3.1 --output-dir wheelhouse
      env:
        CIBW_BUILD_VERBOSITY: 1
        CIBW_BEFORE_BUILD: "pip install numpy"
        # Install Rust inside manylinux container (host toolchain not available)
        CIBW_BEFORE_ALL_LINUX: "curl https://sh.rustup.rs -sSf | sh -s -- --default-toolchain stable -y"
        CIBW_ENVIRONMENT_LINUX: 'PATH="$HOME/.cargo/bin:$PATH"'
        # Build only native arch per runner (no cross-compilation or emulation)
        CIBW_ARCHS_LINUX: "native"
        CIBW_ARCHS_MACOS: "native"
        CIBW_ARCHS_WINDOWS: "native"
        CIBW_ENVIRONMENT_MACOS: 'MACOSX_DEPLOYMENT_TARGET=10.13'

    # One artifact per Python (wheel-<os>-<python>), as before the
    # consolidation; the publish job merges them with a wheel-* pattern.
    # On Linux each holds two wheels: manylinux and musllinux.
    - name: Upload wheel (Python 3.10)
      uses: actions/upload-artifact@v4
      with:
        name: wheel-${{ matrix.os }}-3.10
        path: ./wheelhouse/*-cp310-cp310-*.whl
        if-no-files-found: error

    - name: Upload wheel (Python 3.11)
      uses: actions/upload-artifact@v4
      with:
        name: wheel-${{ matrix.os }}-3.11
        path: ./wheelhouse/*-cp311-cp311-*.whl
        if-no-files-found: error

    - name: Upload wheel (Python 3.12)
      uses: actions/upload-artifact@v4
      with:
        name: wheel-${{ matrix.os }}-3.12
        path: ./wheelhouse/*-cp312-cp312-*.whl
        if-no-files-found: error

    - name: Upload wheel (Python 3.13)
      uses: actions/upload-artifact@v4
      with:
        name: wheel-${{ matrix.os }}-3.13
        path: ./wheelhouse/*-cp313-cp313-*.whl
        if-no-files-found: error

    - name: Upload wheel (Python 3.14)
      uses: actions/upload-artifact@v4
      with:
        name: wheel-${{ matrix.os }}-3.14
        path: ./wheelhouse/*-cp314-cp314-*.whl
        if-no-files-found: error

    # Each wheel is installed into its own venv outside the checkout and run
    # through the venv's interpreter directly (not `uv run`, which would sync
    # the project into the env and replace the wheel with a source build).
    - name: Test wheels in isolated venvs
      shell: bash
      run: |
        set -euo pipefail
        for v in $PYTHON_VERSIONS; do
          tag="cp${v/./}"
          # The musllinux wheels cannot be installed on the glibc runner.
          wheel=$(ls wheelhouse/*-"${tag}"-"${tag}"-*.whl | grep -v musllinux)
          venv="../wheel-venv-$v"
          echo "::group::Python $v: $(basename "$wheel")"
          uv venv "$venv" --python "$v"
          uv pip install --python "$venv" "${wheel}[test]" pytest-xdist
          if [ "$RUNNER_OS" = "Windows" ]; then py="$venv/Scripts/python.exe"; else py="$venv/bin/python"; fi
          "$py" -m pytest tests/ -v --tb=short -n auto
          echo "::endgroup::"
        done

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Build sdist
      run: uv build --sdist

    - name: Upload sdist
      uses: actions/upload-artifact@v4
      with:
        name: sdist
        path: dist/*.tar.gz

  pyodide:
    uses: ./.github/workflows/pyodide.yml

  upload-pyodide:
    name: Upload Pyodide wheels to GitHub Release
    runs-on: ubuntu-latest
    needs: [pyodide]
    if: github.event_name == 'release'
    permissions:
      contents: write
    steps:
    # Only the legacy-tagged (pyodide_*) wheel is hosted here. PEP 783
    # (pyemscripten_*) wheels go to PyPI in the publish job instead.
    - name: Download Pyodide wheels (legacy tag)
      uses: actions/download-artifact@v4
      with:
        pattern: pyodide-wheel-0.*
        path: dist/
        merge-multiple: true
    - name: List wheels
      run: ls -la dist/
    - name: Upload to GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber --repo "${{ github.repository }}"

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build-and-test, build-sdist, pyodide]
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish_to_pypi == true)
    environment:
      name: pypi
      url: https://pypi.org/p/libibt

    permissions:
      id-token: write
      contents: write

    steps:
    - name: Download CPython wheels
      uses: actions/download-artifact@v4
      with:
        pattern: wheel-*
        path: dist/
        merge-multiple: true

    - name: Download sdist
      uses: actions/download-artifact@v4
      with:
        name: sdist
        path: dist/

    # PEP 783 wasm wheels (pyemscripten_*) are accepted by PyPI. Pyodide 0.29
    # and earlier predate the PEP, so their pyodide_*-tagged wheels are NOT
    # collected here — they ship as GitHub Release assets.
    - name: Download PEP 783 Pyodide wheel
      uses: actions/download-artifact@v4
      with:
        name: pyodide-wheel-314
        path: dist/

    - name: List artifacts
      run: ls -la dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist/

    - name: Upload assets to GitHub Release
      if: github.event_name == 'release'
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release upload "${{ github.event.release.tag_name }}" dist/* --repo "${{ github.repository }}"

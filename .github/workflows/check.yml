name: Check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Clippy lints
        run: cargo clippy --all-targets -- -W clippy::all

      - name: Rust tests
        run: cargo test

      # The C ABI library (crates/libibt-ffi). A debug build, which the Rust
      # tests have all but compiled already. Setting LIBIBT_FFI_LIB makes the
      # Python tests below run tests/test_ffi.py against it instead of
      # skipping it.
      - name: Build the C ABI library
        run: |
          cargo build -p libibt-ffi
          test -f target/debug/libibt_ffi.so
          echo "LIBIBT_FFI_LIB=target/debug/libibt_ffi.so" >> "$GITHUB_ENV"

      - name: Install Python dependencies
        run: uv sync

      - name: Check Python formatting
        run: uv run black --check .

      - name: Type check
        run: uv run mypy src/

      - name: Python tests
        run: uv run pytest tests/ -v -n auto

  # Build and Publish (publish.yml) already runs the Pyodide jobs on pushes
  # and on PRs into main, so run them here only for the PRs it skips:
  # stacked PRs whose base is another PR's branch.
  pyodide:
    if: github.event_name == 'pull_request' && github.base_ref != 'main' && github.base_ref != 'master'
    uses: ./.github/workflows/pyodide.yml
